# Example nginx locations mirroring `apps/web/lib/gateway-config.ts`.
# Browser entry: `/` (web app). Other apps are mounted under path prefixes.
#
# Adjust upstream host/ports for your deployment (compose, k8s, etc.).
# Prefer defining `/platform` and `/author` before the catch-all `/`.
# These locations must match NEXT_PUBLIC_GATEWAY_PLATFORM_PATH / NEXT_PUBLIC_GATEWAY_AUTHOR_PATH (defaults shown).
#
# Password recovery (cookie name: see `PASSWORD_RECOVERY_COOKIE` in
# `@workspace/gateway-auth/password-recovery` — keep in sync with platform + web proxy):
# When `pf_password_recovery_pending=1` is set, the app expects users to finish
# `/platform/auth/update-password` before other platform routes. In dev this is
# also enforced early in `apps/web/proxy.ts`. In production, mirror that here so
# redirects happen at the edge (307) without loading intermediate HTML.
#
# Place this `map` in the `http { }` block (once per nginx), before `server`:
#
#   map $http_cookie $pf_password_recovery_pending {
#       default 0;
#       "~*pf_password_recovery_pending=1" 1;
#   }
#
# If your platform mount is not `/platform`, change paths and `X-Forwarded-Prefix`
# to match `NEXT_PUBLIC_APP_BASE_PATH` / `NEXT_PUBLIC_GATEWAY_PLATFORM_PATH`.
#
# Auth redirects (author → platform `?next=...`, `inferSiteOrigin` in apps):
# - Keep `Host` as the public hostname (not the upstream), so server-side
#   absolute URLs match the browser (`https://your-domain/...`).
# - `X-Forwarded-Proto` must reflect what clients use (TLS terminator in front).
# - `X-Forwarded-Host` matches `Host` for frameworks that prefer it first.
# In each app set `NEXT_PUBLIC_GATEWAY_ORIGIN=https://your-domain` (no trailing slash)
# for stable sign-in URLs; if unset, origin is derived from these headers.

# Platform (Supabase auth, authenticated shell): base path `/platform`
# More specific paths first so recovery redirect does not block confirm / update-password,
# Next.js `/_next/*`, or static files (otherwise CSS/JS get 307 → broken UI / request loops).
location /platform/_next/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /platform;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /platform/auth/update-password {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /platform;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /platform/auth/confirm {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /platform;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /platform {
    # Requires `map ... $pf_password_recovery_pending` in `http { }` (see header comment).
    if ($pf_password_recovery_pending = 1) {
        return 307 /platform/auth/update-password;
    }
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /platform;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Author (Payload): base path `/author`
location /author {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /author;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Public shell / marketing: web app (root).
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
