services:
  studio:
    build:
      context: ..
      dockerfile: apps/studio/Dockerfile
      target: dev
    ports:
      - 8082:8082
    develop:
      watch:
        - action: sync
          path: ../apps/studio
          target: /app/apps/studio
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  mail:
    container_name: supabase-mail
    image: inbucket/inbucket:3.0.3
    ports:
      - '127.0.0.1:2500:2500' # SMTP
      - '127.0.0.1:9090:9000' # web interface
      - '127.0.0.1:1100:1100' # POP3
  auth:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GOTRUE_SMTP_HOST=host.docker.internal
      - GOTRUE_SMTP_PORT=2500
      - GOTRUE_SMTP_ADMIN_EMAIL=admin@proflow.local
      - GOTRUE_SMTP_SENDER_NAME=ProFlow Dev
      - GOTRUE_SMTP_USER=
      - GOTRUE_SMTP_PASS=

  functions:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  meta:
    ports:
      - 5555:8080
  db:
    restart: 'no'
    # Loopback-only: Makefile db-push/db-diff/db-pull use supabase_admin on this port; pooler session role may lack ownership on existing tables.
    ports:
      - '127.0.0.1:54322:5432'
    volumes:
      # Always use a fresh database when developing
      - /var/lib/postgresql/data
      # Seed data should be inserted last (alphabetical order)
      - ./dev/data.sql:/docker-entrypoint-initdb.d/seed.sql
  storage:
    volumes:
      - /var/lib/storage
