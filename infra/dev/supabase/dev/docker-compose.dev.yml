services:
  studio:
    # Use the prebuilt prod image from the base compose (this repo has no apps/studio
    # source to build from). Studio listens on 3000 inside the container; expose it on
    # host 8082 → open http://localhost:8082.
    ports:
      - 8082:3000

  auth:
    # Dev mail goes to the Maildev container (infra/dev/docker-compose.yml). Auth and
    # Maildev share the `proflow` Docker network, so reach it by service name on its
    # INTERNAL port (1025) — NOT host.docker.internal:2500 (that host port is bound to
    # 127.0.0.1 and is unreachable from the Docker bridge, so GoTrue fails with
    # "dial ... 2500: connection refused").
    environment:
      - GOTRUE_SMTP_HOST=maildev
      - GOTRUE_SMTP_PORT=1025
      - GOTRUE_SMTP_ADMIN_EMAIL=admin@proflow.local
      - GOTRUE_SMTP_SENDER_NAME=ProFlow Dev
      - GOTRUE_SMTP_USER=
      - GOTRUE_SMTP_PASS=

  functions:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  meta:
    ports:
      - 5555:8080
  db:
    restart: 'no'
    # Loopback-only: Makefile db-push/db-diff/db-pull use supabase_admin on this port; pooler session role may lack ownership on existing tables.
    ports:
      - '127.0.0.1:54322:5432'
    volumes:
      # Always use a fresh database when developing
      - /var/lib/postgresql/data
      # Seed data should be inserted last (alphabetical order)
      - ./dev/data.sql:/docker-entrypoint-initdb.d/seed.sql
  storage:
    volumes:
      - /var/lib/storage
