name: DB Types Check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'packages/db/**'
      - 'Makefile'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/db-types-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-types-check:
    runs-on: ubuntu-latest
    env:
      SELF_HOSTED_DB_URL: ${{ secrets.SELF_HOSTED_DB_URL }}
      SELF_HOSTED_DB_SSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Require database connection secret
        run: |
          if [ -z "${SELF_HOSTED_DB_URL:-}" ]; then
            echo "SELF_HOSTED_DB_URL secret is required for db:types:check" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated Database types are fresh
        run: bun run db:types:check